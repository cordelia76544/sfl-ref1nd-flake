name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: python3 -m unittest discover -s tests
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs
      - run: ./result/lib/sfl/resources/daemon/sing-box-daemon --help
      - run: nix build .#honk --out-link result-honk --print-build-logs
      - run: python3 scripts/check-honk.py ./result-honk/bin/honk-core

